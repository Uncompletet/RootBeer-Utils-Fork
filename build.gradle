plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'java'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group
base { archivesName = project.archives_base_name }

// Java 25 toolchain (matches the original mod's `java>=25` dep and class-file major 69).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven { url "https://maven.blamejared.com/" }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No `mappings` line for 26.1+ — there are no obfuscation mappings because
    // the game ships with real names. Loom in unmapped mode skips remapping.

    // Plain `implementation` (not `modImplementation`); no remapping needed.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional settings-screen integration; loaded only when Mod Menu is installed.
    compileOnly "com.terraformersmc:modmenu:18.0.0"

    // Optional settings-screen integration; loaded only when Mod Menu is installed.
    compileOnly "com.terraformersmc:modmenu:18.0.0"

    // Cloth Config API
    api("me.shedaniel.cloth:cloth-config-fabric:26.1.154") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Lombok for CustomClientBrand
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"


    processResources {
        inputs.property "version", project.mod_version
        inputs.property "minecraft_version", project.minecraft_version
        inputs.property "loader_version", project.loader_version
        inputs.property "fabric_version", project.fabric_version

        filesMatching("fabric.mod.json") {
            expand([
                    "version"          : project.mod_version,
                    "minecraft_version": project.minecraft_version,
                    "loader_version"   : project.loader_version,
                    "fabric_version"   : project.fabric_version
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = "UTF-8"
    }

    jar {
        from("LICENSE") {
            rename {
                "${it}_${project.archives_base_name}"
            }
        }
    }
}